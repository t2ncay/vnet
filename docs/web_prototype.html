      // ============================================================
      // MARKUP RENDERING HELPERS
      // ============================================================
      function applyColorTags(text) {
        return text
          .replace(/\|/g, "") // remove pipe separators
          .replace(/\x1b\[32m/g, '<span class="hl-green">')
          .replace(/\x1b\[36m/g, '<span class="hl-cyan">')
          .replace(/\x1b\[33m/g, '<span class="hl-amber">')
          .replace(/\x1b\[31m/g, '<span class="hl-red">')
          .replace(/\x1b\[90m/g, '<span class="hl-ghost">')
          .replace(/\x1b\[0m/g, "</span>");
      }

      function applyBrowserTags(text) {
        // [TITLE] -> large
        text = text.replace(
          /\[TITLE\]\s*(.*)/g,
          '<span class="hl-title">$1</span>',
        );
        // [SUBTITLE]
        text = text.replace(
          /\[SUBTITLE\]\s*(.*)/g,
          '<span class="hl-sub">$1</span>',
        );
        // [HR]
        text = text.replace(/\[HR\]/g, '<hr class="bp-divider" />');
        // [BADGE:label:color]
        text = text.replace(
          /\[BADGE:([^:\]]+):([^\]]+)\]/g,
          (m, label, color) => {
            const cls = color.toLowerCase();
            return `<span class="hl-badge b-${cls}">${label}</span>`;
          },
        );
        // [LINK:url] >> label
        text = text.replace(
          /\[LINK:([^\]]+)\]\s*>>\s*([^\n]*)/g,
          (m, url, label) => {
            const display = label.trim() || url;
            return `<span class="hl-link" data-url="${url}">${display}</span>`;
          },
        );
        // [LINK:url] alone
        text = text.replace(
          /\[LINK:([^\]]+)\]/g,
          (m, url) => `<span class="hl-link" data-url="${url}">${url}</span>`,
        );
        // [TEXT]
        text = text.replace(/\[TEXT\]\s*(.*)/g, "$1");
        // [CODE]
        text = text.replace(
          /\[CODE\]\s*(.*)/g,
          '<span style="color:var(--color-cyber-green)">$1</span>',
        );
        // [BLOOD]
        text = text.replace(
          /\[BLOOD\]\s*(.*)/g,
          '<span style="color:var(--color-cyber-pink)">$1</span>',
        );
        // [PULSE]
        text = text.replace(
          /\[PULSE\]\s*(.*)/g,
          '<span style="color:var(--color-cyber-orange)">$1</span>',
        );
        // [GLITCH]
        text = text.replace(
          /\[GLITCH\]\s*(.*)/g,
          '<span style="color:var(--color-cyber-green);text-shadow:0 0 8px var(--color-cyber-green)">$1</span>',
        );
        // [BOX]
        text = text.replace(
          /\[BOX\]\s*(.*)/g,
          '<span style="color:var(--color-cyber-blue)">$1</span>',
        );
        // [GAUGE:pct:label]
        text = text.replace(/\[GAUGE:([\d.]+):([^\]]+)\]/g, (m, pct, label) => {
          const p = Math.min(100, parseFloat(pct) || 0);
          const color =
            p > 70
              ? "var(--color-cyber-pink)"
              : p > 40
                ? "var(--color-cyber-orange)"
                : "var(--color-cyber-green)";
          return `<span style="display:inline-flex;align-items:center;gap:8px;background:var(--color-gray-900);padding:2px 8px;border-radius:4px;border:1px solid var(--color-gray-800);">
                                <span style="width:120px;height:8px;background:var(--color-gray-800);border-radius:4px;overflow:hidden;">
                                    <span style="display:block;height:100%;width:${p}%;background:${color};border-radius:4px;"></span>
                                </span>
                                <span style="color:var(--color-cyber-orange);font-size:0.85rem;">${label} [${p}%]</span>
                            </span>`;
        });
        // [WARN]
        text = text.replace(
          /\[WARN\]\s*(.*)/g,
          '<span style="color:var(--color-cyber-pink)">⚠ $1</span>',
        );
        return text;
      }

      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      // ============================================================
      // COMMAND HANDLER
      // ============================================================
      function handleCommand(cmd) {
        addCliLogRaw(`> ${cmd}`);
        const parts = cmd.trim().split(/\s+/);
        const token = parts[0].toLowerCase();
        const args = parts.slice(1).join(" ");

        // Help
        if (token === "help") {
          addCliLog("", "========== VNET COMMAND REFERENCE ==========");
          addCliLog("", "  NAVIGATION:");
          addCliLog("", "  connect <url>  - Navigate to VNET site");
          addCliLog("", "  home           - Return to vnet.dir");
          addCliLog("", "  back           - Go to previous page");
          addCliLog("", "  ECONOMY:");
          addCliLog("", "  wallet         - Show balance & stats");
          addCliLog("", "  buy ice        - Buy ICE shield (0.30 VCOIN)");
          addCliLog("", "  UTILITY:");
          addCliLog("", "  scan           - Deep subnet sweep");
          addCliLog("", "  history        - Show discovered sites");
          addCliLog("", "  clear          - Clear terminal");
          addCliLog("", "  theme <name>   - Change color theme");
          addCliLog("", "  status         - Show network status");
          addCliLog("", "  info           - Show detailed system info");
          addCliLog("", "  EXPLOITS:");
          addCliLog("", "  dos <port>     - DOS attack (0.25 VCOIN)");
          addCliLog("", "  spike <port>   - Trace spike (0.20 VCOIN)");
          addCliLog("", "  overload <url> - Overload site (1.50 VCOIN)");
          addCliLog("", "  VICTORY:");
          addCliLog("", "  takeover       - Economic victory (25.0 VCOIN)");
          addCliLog("", "============================================");
          return;
        }

        // Connect / goto
        if (token === "connect" || token === "goto") {
          if (!args) {
            addCliLog("ERROR", "Usage: connect <url>");
          } else {
            navigateTo(args);
          }
          return;
        }

        // Home
        if (token === "home") {
          navigateTo("vnet.dir");
          return;
        }

        // Back
        if (token === "back") {
          navigateBack();
          return;
        }

        // Wallet
        if (token === "wallet") {
          addCliLog("", "========== WALLET & DEFENSE ==========");
          addCliLog("", `  VCOIN BALANCE  : ${STATE.vcoin.toFixed(2)} VCOIN`);
          addCliLog("", `  TRACE THREAT   : ${STATE.traceLevel}%`);
          addCliLog("", `  ICE SHIELDS    : [${STATE.iceShields}/3] LAYERS`);
          addCliLog("", `  CRT HEAT       : ${STATE.crtHeat.toFixed(0)} C`);
          addCliLog("", `  NEURAL PARANOIA: ${STATE.paranoia.toFixed(0)}%`);
          addCliLog("", "====================================");
          return;
        }

        // Buy ice
        if (token === "buy" && args === "ice") {
          if (STATE.iceShields >= 3) {
            addCliLog("ERROR", "MAX ICE SHIELDS REACHED (3/3)");
          } else if (STATE.vcoin < 0.3) {
            addCliLog(
              "ERROR",
              `INSUFFICIENT VCOIN (NEEDS 0.30 VCOIN, HAVE ${STATE.vcoin.toFixed(2)})`,
            );
          } else {
            STATE.vcoin -= 0.3;
            STATE.iceShields++;
            addCliLog(
              "ICE",
              `ICE SHIELD PURCHASED! ACTIVE: ${STATE.iceShields}/3`,
            );
            addFeed("ICE", "Player purchased ICE shield");
            updateTopBar();
          }
          return;
        }

        // Scan
        if (token === "scan") {
          addCliLog("SCAN", "INITIATING DEEP SUBNET FREQUENCY SWEEP...");
          // Simulate discovery
          const newSites = Math.floor(Math.random() * 3) + 1;
          const possible = [
            "forum.vnet",
            "bounty.vnet",
            "vektrapay.vnet",
            "hashbeat.vnet",
            "watchtower.vnet",
            "orbital.vnet",
            "morgue.vnet",
            "cult.vnet",
            "void.vnet",
            "ghost.vnet",
            "silence.vnet",
            "blackbank.vnet",
          ];
          let found = 0;
          for (const s of possible) {
            if (!STATE.assignedSites.includes(s) && found < newSites) {
              STATE.assignedSites.push(s);
              addCliLog("SCAN", `DISCOVERED ${s}`);
              found++;
            }
          }
          if (found === 0) addCliLog("SCAN", "NO NEW SITES FOUND");
          // Reload page if browser open
          if (STATE.currentURL === "vnet.dir") loadPage("vnet.dir");
          renderAllBrowsers();
          return;
        }

        // History
        if (token === "history") {
          addCliLog("", "========== DISCOVERED SUBNET DIRECTORY ==========");
          if (STATE.assignedSites.length > 0) {
            for (const s of STATE.assignedSites) {
              addCliLog("", `  -> vnet://${s}`);
            }
            addCliLog("", `  Total: ${STATE.assignedSites.length} sites`);
          } else {
            addCliLog("", "  [NO SITES DISCOVERED YET]");
          }
          addCliLog("", "==================================================");
          return;
        }

        // Clear
        if (token === "clear") {
          STATE.cliLogs = [];
          renderTerminal();
          return;
        }

        // Theme
        if (token === "theme") {
          if (!args) {
            addCliLog("THEME", `Current theme: ${currentTheme}`);
            addCliLog("THEME", "Available: " + Object.keys(THEMES).join(", "));
          } else if (THEMES[args]) {
            applyTheme(args);
            addCliLog("THEME", `Switched to '${args}'`);

            addCliLog("ERROR", `Unknown theme '${args}'`);
          }
          return;

        // Status
        if (token === "status") {
          addCliLog("", "========== NETWORK STATUS ==========");
          addCliLog("", `  Current URL  : vnet://${STATE.currentURL}`);
          addCliLog("", `  Active Port  : ${STATE.port}`);
          addCliLog("", `  VCOIN        : ${STATE.vcoin.toFixed(2)}`);
          addCliLog("", `  Trace Level  : ${STATE.traceLevel}%`);

          addCliLog("", `  CRT Heat     : ${STATE.crtHeat.toFixed(0)}°C`);
          addCliLog("", "====================================");
          return;

        // Info
        if (token === "info") {

          addCliLog("", `  PORT      : ${STATE.port}`);

          addCliLog("", `  CRT HEAT  : ${STATE.crtHeat.toFixed(0)}°C`);
          addCliLog("", `  PARANOIA  : ${STATE.paranoia.toFixed(0)}%`);
          addCliLog(
            "",
            `  SITES     : ${STATE.assignedSites.length} discovered`,

          addCliLog("", "================================");
          return;
        }

        // DOS
        if (token === "dos") {
          if (!args) {
            addCliLog("ERROR", "Usage: dos <port>");
          } else if (STATE.vcoin < 0.25) {
            addCliLog(
              "ERROR",
              `NEED 0.25 VCOIN (CURRENT: ${STATE.vcoin.toFixed(2)})`,
            );
          } else {
            STATE.vcoin -= 0.25;
            addCliLog("DOS", `DOS ATTACK SENT TO PORT ${args}`);
            addFeed("DOS ATTACK", `Player froze port ${args}`);
            STATE.glitchIntensity = 0.6;
            updateTopBar();
          }
          return;
        }

        // Spike
        if (token === "spike") {
          if (!args) {
            addCliLog("ERROR", "Usage: spike <port>");
          } else if (STATE.vcoin < 0.2) {
            addCliLog(
              "ERROR",
              `NEED 0.20 VCOIN (CURRENT: ${STATE.vcoin.toFixed(2)})`,
            );
          } else {
            STATE.vcoin -= 0.2;
            addCliLog("TRACE SPIKE", `SENT TO PORT ${args}`);
            addFeed("TRACE SPIKE", `Player spiked port ${args}`);
            STATE.glitchIntensity = 0.4;
            updateTopBar();
          }
          return;
        }

        // Overload
        if (token === "overload") {
          if (!args) {
            addCliLog("ERROR", "Usage: overload <url>");
          } else if (STATE.vcoin < 1.5) {
            addCliLog(
              "ERROR",
              `NEED 1.50 VCOIN (CURRENT: ${STATE.vcoin.toFixed(2)})`,
            );
          } else {
            STATE.vcoin -= 1.5;
            STATE.crtHeat += 15;
            addCliLog("OVERLOAD", `DISPATCHED CASCADE TO ${args}`);
            addFeed("OVERLOAD", `Player fried ${args}`);
            STATE.glitchIntensity = 0.8;
            updateTopBar();
          }
          return;
        }

        // Takeover
        if (token === "takeover") {
          if (STATE.vcoin >= 25.0) {
            addCliLog(
              "",
              "╔════════════════════════════════════════════════════╗",

            addCliLog(

              "║  🏆 ECONOMIC TAKEOVER: VICTORY!                    ║",

      // ============================================================
      document.addEventListener("keydown", (e) => {
        // Ctrl+1,2,3 for workspaces
        if (e.ctrlKey && ["1", "2", "3"].includes(e.key)) {
          const idx = parseInt(e.key) - 1;
          if (idx < 3) {
            STATE.wsCurrent = idx;
            wsIndicator.querySelectorAll(".ws-dot").forEach((d, i) => {
              d.classList.toggle("active", i === idx);
            });
            renderWindows();
            e.preventDefault();
          }
        }
        // Escape to blur terminal inputs
        if (e.key === "Escape") {
          document.activeElement?.blur();
        }
      });

      // ============================================================
      // WINDOW RESIZE HANDLING
      // ============================================================
      window.addEventListener("resize", () => {
        // Clamp windows
        for (const w of STATE.windows) {
          if (w.maximized) continue;
          if (w.x + w.w > window.innerWidth - 10)
            w.x = window.innerWidth - w.w - 10;
          if (w.y + w.h > window.innerHeight - 50)
            w.y = window.innerHeight - w.h - 50;
          if (w.x < 0) w.x = 0;
          if (w.y < 44) w.y = 44;
          if (w.w < 240) w.w = 240;
          if (w.h < 140) w.h = 140;
        }
        renderWindows();
      });

      // ============================================================
      // GAME LOOP (simulate updates)
      // ============================================================
      let lastTime = 0;

      function gameLoop(time) {
        const dt = Math.min(0.05, (time - lastTime) / 1000);
        lastTime = time;

        // Update runtime
        STATE.runTime += dt;

        // Cooldowns
        if (STATE.miningCooldown > 0) STATE.miningCooldown -= dt;
        if (STATE.raidCooldown > 0) STATE.raidCooldown -= dt;

        // CRT heat decay
        STATE.crtHeat -= dt * 0.5;
        if (STATE.crtHeat < 35) STATE.crtHeat = 35;

        // Glitch decay
        if (STATE.glitchIntensity > 0) {
          STATE.glitchIntensity -= dt * 2;
          if (STATE.glitchIntensity < 0) STATE.glitchIntensity = 0;
        }

        // Update top bar
        if (Math.floor(STATE.runTime) % 2 === 0) {
          updateTopBar();
        }

        // Simulate mining block generation
        if (Math.floor(STATE.runTime) % 15 === 0 && STATE.runTime > 2) {
          const blockId =
            "BLK" + String(Math.floor(Math.random() * 9000 + 1000));
          const reward = 0.15 + Math.random() * 0.35;
          if (!STATE.minedBlocks.some((b) => b.startsWith(blockId))) {
            STATE.minedBlocks.push(`${blockId}:${reward.toFixed(2)}`);
            if (STATE.minedBlocks.length > 20) STATE.minedBlocks.shift();
            // Notify if on crypto
            if (STATE.currentURL === "crypto.vnet") {
              addFeed(
                "MINER",
                `New block available: ${blockId} (${reward.toFixed(2)} VCOIN)`,
              );
            }
          }
        }

        // Glitch effect on page
        if (STATE.glitchIntensity > 0.1) {
          document.querySelectorAll(".window-content").forEach((el) => {
            const intensity = STATE.glitchIntensity;
            const dx = (Math.random() - 0.5) * intensity * 4;
            const dy = (Math.random() - 0.5) * intensity * 3;
            el.style.transform = `translate(${dx}px, ${dy}px)`;
            el.style.transition = "none";
          });
          setTimeout(() => {
            document.querySelectorAll(".window-content").forEach((el) => {
              el.style.transform = "";
              el.style.transition = "";
            });
          }, 50);
        }

        requestAnimationFrame(gameLoop);
      }
